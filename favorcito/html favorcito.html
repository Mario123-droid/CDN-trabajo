<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web Interactiva</title>
    <link rel="stylesheet" href="css favorcito.css">
</head>
<body>

    <header class="top-bar">
        <div class="image-slider">
            <img src="placeholder-arboles.png" alt="Imagen 1">
            <img src="placeholder-image-2.png" alt="Imagen 2">
            <img src="placeholder-image-3.png" alt="Imagen 3">
            <img src="placeholder-image-4.png" alt="Imagen 4">
            <img src="placeholder-image-5.png" alt="Imagen 5">
            <img src="placeholder-image-6.png" alt="Imagen 6">
            <img src="placeholder-image-1.png" alt="Imagen 1 - Duplicada">
            <img src="placeholder-image-2.png" alt="Imagen 2 - Duplicada">
            <img src="placeholder-image-3.png" alt="Imagen 3 - Duplicada">
            <img src="placeholder-image-4.png" alt="Imagen 4 - Duplicada">
            <img src="placeholder-image-5.png" alt="Imagen 5 - Duplicada">
            <img src="placeholder-image-6.png" alt="Imagen 6 - Duplicada">
        </div>
    </header>

    <main class="content-area">
        <div class="video-container">
            <iframe
                src="https://www.youtube.com/embed/VIDEO_ID_AQUI?autoplay=0&controls=1&showinfo=0&rel=0"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </main>

    <script src="javascript favoctio.js"></script>
</body>
</html>
